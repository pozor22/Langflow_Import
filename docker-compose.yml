services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - langflow-network
    restart: unless-stopped

  langflow:
    build:
      context: .
      dockerfile: Dockerfile-langflow
    container_name: langflow
    user: "0:0"
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Langflow
      - LANGFLOW_DATABASE_URL=postgresql://langflow:langflow@postgres:5432/langflow
      - LANGFLOW_CONFIG_DIR=/app/langflow
      - LANGFLOW_SAVE_DB_IN_CONFIG_DIR=true
      - LANGFLOW_LOG_LEVEL=debug
      - LANGFLOW_COMPONENTS_PATH=/app/custom_components
      - LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT=OLLAMA_BASE_URL
      - LANGFLOW_LOAD_FLOWS_PATH=/app/flows
      - LANGFLOW_SKIP_AUTH_AUTO_LOGIN=true

      # Ollama
      - OLLAMA_BASE_URL=http://ollama:11434

      # Langfuse
      - LANGFUSE_SECRET_KEY=sk-...
      - LANGFUSE_PUBLIC_KEY=pk-...
      - LANGFUSE_HOST=https://cloud.langfuse.com
    volumes:
      - langflow_data:/app/langflow
      - file_injest:/app/file_injest
      - flow_output:/app/flow_output
      - nltk_data:/root/nltk_data
      - ./custom_components:/app/custom_components
      - ./flows:/app/flows
      - ./config:/app/config
      - ./exemple:/app/exemple
    networks:
      - langflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/collections"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:17
    container_name: langflow-postgres
    environment:
      POSTGRES_USER: langflow
      POSTGRES_PASSWORD: langflow
      POSTGRES_DB: langflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - langflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ollama_data:
  langflow_data:
  postgres_data:
  file_injest:
  flow_output:
  nltk_data:

networks:
  langflow-network:
    driver: bridge
    name: langflow-network